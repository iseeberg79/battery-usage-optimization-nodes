name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # No registry-url: it would write an .npmrc with a placeholder _authToken,
    # which npm uses instead of OIDC and fails with 404. The default registry
    # is registry.npmjs.org, which trusted publishing targets via OIDC.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # The release tag is the source of truth for the published version, so a
    # forgotten bump in package.json can no longer block/mismatch a release.
    - name: Set package version from release tag
      run: |
        RELEASE_TAG=${GITHUB_REF#refs/tags/}
        echo "Release tag: $RELEASE_TAG"
        npm version "$RELEASE_TAG" --no-git-tag-version --allow-same-version
        echo "✅ package.json version set to $RELEASE_TAG"

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Build package
      run: npm run grunt

    - name: Generate JSDoc
      run: npx jsdoc -c jsdoc.json

    # Trusted Publishing (OIDC) needs npm >= 11.5.1; node 20 ships npm 10.
    - name: Upgrade npm for trusted publishing
      run: |
        npm install -g npm@latest
        npm --version

    # No NODE_AUTH_TOKEN: authenticates via OIDC against the trusted
    # publisher configured for this package on npmjs.com. Provenance is
    # generated automatically.
    - name: Publish to npm
      run: npm publish

    - name: Create package artifact
      run: npm pack

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: npm-package
        path: '*.tgz'
